# Build the production image on every merge to main and push it to GHCR.
# Tags: the full commit SHA (what deploy uses) and :main. Uses only GITHUB_TOKEN.
name: build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/jayashreeglobalventures-amogh/fitness-app:${{ github.sha }}
            ghcr.io/jayashreeglobalventures-amogh/fitness-app:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
